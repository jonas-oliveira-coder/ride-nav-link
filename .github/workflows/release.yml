name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "KEYSTORE=/tmp/release.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=$RELEASE_KEY_ALIAS" >> $GITHUB_ENV
            echo "STORE_PASS=$RELEASE_STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASS=$RELEASE_KEY_PASS" >> $GITHUB_ENV
          else
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE=$HOME/.android/debug.keystore" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK via Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p dist
          APK_SRC=$(ls ride_nav_link/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" dist/RideNavLink.apk
          cd dist
          sha256sum RideNavLink.apk > RideNavLink.apk.sha256
          echo "SHA256: $(cat RideNavLink.apk.sha256)"

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk '/^## \[/{if (found) exit; found=1} found' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release ${{ github.ref_name }}" > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/RideNavLink.apk
            dist/RideNavLink.apk.sha256
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload APK Artifact (Workflow Run)
        uses: actions/upload-artifact@v7
        with:
          name: RideNavLink-APK
          path: dist/RideNavLink.apk
